<!DOCTYPE html>

<head>
    <!--    storage.js exists to initialise data and functions for cleaner and easier execution   -->
    <script src="storage.js"></script>
    <script src="menu.js"></script>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="list.css">
</head>


<body>
    <!--    MENU BAR    -->
    <div class="menu">
        
        <div class="button" id="menuButton" onclick="sidemenu()">
            <svg class="buttongraphic" x="0px" y="0px" viewBox="0 0 50 50" >
                <path stroke="white" fill="white" d="M 0 7.5 L 0 12.5 L 50 12.5 L 50 7.5 Z M 0 22.5 L 0 27.5 L 50 27.5 L 50 22.5 Z M 0 37.5 L 0 42.5 L 50 42.5 L 50 37.5 Z"></path>
            </svg>
        </div>
        <div class="button search" id="srchmenuButton" onclick="dropmenu()">
            <svg fill="white" class="buttongraphic" viewBox="0 0 16 16">
                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
            </svg>
            <h2>Search</h2>
        </div>
        
        
        
        <img class="logo" onclick="location.href = 'index.html'" src="images/Logo.png">
        <h3 class="logo" onclick="location.href = 'index.html'">Properties Inc. <br> Area 206</h3>
        
    </div>
    
    <div class="focBG" id="obsc" >
        <div class="slideMenu" id="toggMen">
            <div class="cell" onclick="location.href = 'index.html'">
                <h2>Home</h2>
            </div>
            <div class="cell" onclick="location.href = 'list.html'">
                <h2>List</h2>
            </div>
        </div>


        <div class="dropMenu" id="dropMen">
            <form onsubmit="return search()">
                <div class="container">
                    <h3 class="header">Name</h3><hr>
                    <div>
                        <div><search>
                            <input type="text" name="name" id="inpsrch" placeholder="Search by Property Name" autocomplete="off">
                            <input type="submit" value="Search">
                        </search></div>
                    </div>
                </div>

                <div class="container">
                    <h3>Location</h3><hr>

                    <div class="locs">
                    </div>

                </div>
                <div class="container last">
                    <h3 class="header">Type</h3><hr>

                    <div class="typs">
                    </div>

                </div>
            </form>
        </div>
    </div>
    
    <div class="filler"></div>
    <div class="SMscroll" id="sideMenuScroll"></div>
    <div class="sidemenu" id="side">
        <ul class="list" id="stuff">
            <script src="list.js"></script>
        </ul>
    </div>
    
    <div class="cont">
        <div class="thumbnail" id="thumbnail"><div class="overlay"></div></div>
        <h1 class="title" id="name">Select a property from the list from the left</h1>
        <table class="details">
            <tr>
                <td>
                    <h3>Price:</h3>
                    <h3 id="price" class="data">Placeholder</h3>
                </td><td class="filler"></td>
                <td>
                    <h3>Location: </h3>
                    <h3 id="location" class="data">Placeholder</h3>
                </td>
            </tr>
            <tr>
                <td>
                    <h3>Type: </h3>
                    <h3 id="type" class="data">Placeholder</h3>
                </td><td class="filler"></td>
                <td>
                    <h3>Address: </h3>
                    <h3 id="address" class="data">Placeholder</h3>
                </td>
            </tr>
        </table>
        
        <p id="description" class="desc"></p>
        
        <script src="content.js"></script>
    </div>
</body>

<footer>
    <script src="search.js"></script>
</footer>
